<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup R — Periodic Table</title>
  <!--
    Concept: a periodic table of projects, grouped by what the visitor DOES
    with each one — the "chemical families":
      Readables  (Pa, Ga, Eu)   — you read them
      Observables (Ke, Pi)      — you listen to / look at them
      Simulants  (Ta, Si)       — you watch a model run
      Playables  (Zo, As, Sy)   — you play them
    Six of the ten symbols are real elements, which the detail card points out.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #F3EFE4;
      --ink: #1E2229;
      --muted: #6C6A62;
      --rule: #CFC8B6;
      --f-read:  #E9B949;
      --f-obs:   #7AA9E0;
      --f-sim:   #E0715A;
      --f-play:  #72C27A;
      --f-me:    #B9A6E8;
    }
    html, body { min-height: 100%; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    body {
      background:
        linear-gradient(var(--rule) 1px, transparent 1px) 0 0/100% 32px,
        var(--paper);
      background-blend-mode: multiply;
      padding: 40px 24px 60px;
    }
    body::before { /* soften the ruled-paper lines */
      content: ''; position: fixed; inset: 0; background: color-mix(in srgb, var(--paper) 80%, transparent); z-index: -1;
    }

    header { max-width: 1060px; margin: 0 auto 28px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
    h1 { font-weight: 300; font-size: 40px; letter-spacing: -0.01em; }
    h1 b { font-weight: 600; }
    .lede { color: var(--muted); font-size: 14px; max-width: 420px; line-height: 1.5; }
    .links { font-family: 'IBM Plex Mono', monospace; font-size: 12px; display: flex; gap: 14px; }
    .links a { color: var(--ink); }

    .table {
      max-width: 1060px; margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: repeat(3, auto);
      align-items: start;
      gap: 8px;
    }
    .el {
      position: relative;
      aspect-ratio: 1;
      border: 2px solid var(--ink);
      background: var(--fc);
      padding: 8px 10px;
      display: flex; flex-direction: column;
      cursor: pointer;
      color: var(--ink);
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      font: inherit; text-align: left;
    }
    .el:hover, .el:focus-visible, .el.sel { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--ink); outline: none; }
    .el .z { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .el .sym { font-size: clamp(28px, 4.2vw, 50px); font-weight: 600; line-height: 1; margin: auto 0 4px; letter-spacing: -0.02em; }
    .el .nm { font-size: 12px; line-height: 1.15; }
    .el .mass { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: color-mix(in srgb, var(--ink) 70%, transparent); margin-top: 2px; }
    .el.real::after { /* tiny marker: this one's a real element too */
      content: '⚛'; position: absolute; top: 6px; right: 8px; font-size: 13px; opacity: 0.55;
    }
    .el.me { --fc: var(--f-me); }

    /* The big key tile, like the legend on a classroom poster */
    .key {
      grid-column: 2 / 7; grid-row: 1; align-self: stretch;
      border: 2px dashed var(--ink);
      padding: 16px 20px;
      display: grid; grid-template-columns: 120px 1fr; gap: 20px; align-items: center;
      background: color-mix(in srgb, var(--fc, #fff) 22%, var(--paper));
      transition: background 0.3s;
      min-height: 0;
    }
    .key .big {
      aspect-ratio: 1; border: 2px solid var(--ink); background: var(--fc, #fff);
      padding: 10px 12px; display: flex; flex-direction: column;
    }
    .key .big .z { font-family: 'IBM Plex Mono', monospace; font-size: 14px; display: flex; justify-content: space-between; }
    .key .big .sym { font-size: 64px; font-weight: 600; line-height: 1; margin: auto 0 2px; }
    .key .big .nm { font-size: 12px; }
    .key .fam { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .key h2 { font-weight: 600; font-size: 22px; margin: 4px 0 2px; }
    .key .sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .key p { font-size: 14px; line-height: 1.5; }
    .key .cta { display: inline-block; margin-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink); background: var(--fc); border: 2px solid var(--ink); padding: 4px 10px; text-decoration: none; }
    .key .cta:hover { box-shadow: 3px 3px 0 var(--ink); }
    .key .trivia { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

    .legend {
      max-width: 1060px; margin: 24px auto 0;
      display: flex; flex-wrap: wrap; gap: 10px 24px;
      font-size: 13px;
    }
    .legend button {
      display: flex; align-items: center; gap: 8px; background: none; border: none; font: inherit; cursor: pointer; color: var(--ink);
      padding: 4px 6px; border-radius: 3px;
    }
    .legend button:hover, .legend button[aria-pressed="true"] { background: #0000000d; }
    .legend .sw { width: 18px; height: 18px; border: 2px solid var(--ink); background: var(--fc); }
    .legend .verb { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
    .table.filtering .el:not(.me):not(.lit) { opacity: 0.18; filter: grayscale(1); }
    .footnote { max-width: 1060px; margin: 18px auto 0; font-size: 12px; color: var(--muted); }

    @media (max-width: 760px) {
      .table { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .key { grid-column: 1 / -1; grid-row: auto; grid-template-columns: 1fr; order: -1; }
      .key .big { display: none; }
      .el { grid-column: auto !important; grid-row: auto !important; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>The Periodic Table of <b>Tim Jasko</b></h1>
      <p class="lede">I read old books and build new things. Projects are arranged by family, according to what you do with them.</p>
    </div>
    <div class="links">
      <a href="https://github.com/bitflora" target="_blank">GitHub</a>
      <a href="mailto:tim.jasko@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/timothy-jasko-4536816/" target="_blank">LinkedIn</a>
    </div>
  </header>

  <main class="table" id="table">
    <section class="key" id="key" aria-live="polite"></section>
  </main>

  <nav class="legend" id="legend"></nav>
  <p class="footnote">⚛ marks a symbol that is also a real element. Element 0, Tj, is unstable and decays into side projects.</p>

  <script>
    const families = {
      read: { name: 'Readables',   verb: 'you read them',             color: 'var(--f-read)' },
      obs:  { name: 'Observables', verb: 'you look and listen',       color: 'var(--f-obs)'  },
      sim:  { name: 'Simulants',   verb: 'you watch a model run',     color: 'var(--f-sim)'  },
      play: { name: 'Playables',   verb: 'you play them',             color: 'var(--f-play)' },
    };

    // col/row place each element: tall families on the edges, short ones in the middle, like the real thing
    const els = [
      { z: 0,  sym: 'Tj', name: 'Tim Jasko',  fam: 'me', col: 1, row: 1, mass: 'reader · builder',
        title: 'Tim Jasko', sub: 'C++ · Python · TypeScript · Java · Rust · Go · Common Lisp · …', desc: 'Reads old books and builds new things. Cultivates software, but also fruit trees. Hover any element to inspect it, or pick a family below.', cta: ['Say hello', 'mailto:tim.jasko@gmail.com'] },
      { z: 1,  sym: 'Pa', name: 'Patristics', fam: 'read', col: 1, row: 2, mass: '400 texts', real: 'protactinium',
        title: 'Patristics', sub: 'Go · Python · SQLite · AI', desc: 'A three-stage AI pipeline over 400 writings of the early Church Fathers, with 800,000 cross-references extracted and correlated.', cta: ['Visit site', 'https://patristics-site.vercel.app/'] },
      { z: 2,  sym: 'Ga', name: 'Galileo',    fam: 'read', col: 1, row: 3, mass: '1638', real: 'gallium',
        title: 'Galileo’s Two New Sciences', sub: '1638 Original · LLM-assisted learning', desc: 'Galileo’s last book, with the modern mathematical notation, figures, and commentary he didn’t have.', cta: ['Read the text', 'https://galileo-two-new-sciences.vercel.app/'] },
      { z: 3,  sym: 'Eu', name: 'Euclid',     fam: 'read', col: 2, row: 3, mass: 'c. 300 BC', real: 'europium',
        title: 'Euclid Companion', sub: 'Elements · Heath Translation', desc: 'A reading companion for Euclid’s Elements, with explanations on demand for every proposition.', cta: ['Read the text', 'https://euclids-elements-lektor.vercel.app/'] },
      { z: 4,  sym: 'Ke', name: 'Kepler',     fam: 'obs',  col: 4, row: 2, mass: '1619',
        title: 'Kepler’s Harmony of the World', sub: 'Harmonices Mundi · JavaScript', desc: 'Kepler described the planets as making music. Now we can hear what that would have sounded like.', cta: ['Hear it now', 'https://kepler-harmonies.vercel.app/'] },
      { z: 5,  sym: 'Pi', name: 'Piet',       fam: 'obs',  col: 4, row: 3, mass: 'Mandelbrot',
        title: 'Mandelbrot in Piet', sub: 'Piet · Rust · Python', desc: 'A program that is also an abstract painting, and a retrospective on using LLMs to shave the yaks so the developer can focus on the painting.', cta: ['Read the retrospective', 'https://github.com/bitflora/piet#llms-as-yak-shavers'] },
      { z: 6,  sym: 'Ta', name: 'Taco Tuesday', fam: 'sim', col: 5, row: 2, mass: '9 planets', real: 'tantalum',
        title: 'Solar Taco Tuesday', sub: 'Astronomy · JavaScript', desc: 'Every Tuesday, somewhere in the solar system, it’s Taco Tuesday. Orbital mechanics for all nine planets.', cta: ['Open the orrery', '../../taco-tuesday/index.html'] },
      { z: 7,  sym: 'Si', name: 'Sim Tick',   fam: 'sim',  col: 5, row: 3, mass: 'I. scapularis', real: 'silicon',
        title: 'Sim Tick', sub: 'TypeScript · Science', desc: 'A tick lifecycle simulator built from current research, modelling interventions to find efficient ways to eliminate Lyme disease.', cta: ['Visit site', 'https://sim-tick.vercel.app/'] },
      { z: 8,  sym: 'Zo', name: 'Zoogoer',    fam: 'play', col: 7, row: 1, mass: 'Minecraft',
        title: 'Zoogoer', sub: 'Minecraft Mod · Java', desc: 'New villagers who admire the creatures you’ve collected and reward you for a well-built zoo.', cta: ['View on CurseForge', 'https://www.curseforge.com/minecraft/mc-mods/zoogoer'] },
      { z: 9,  sym: 'As', name: 'AsteriskCraft', fam: 'play', col: 7, row: 2, mass: 'Minecraft', real: 'arsenic',
        title: 'AsteriskCraft', sub: 'Minecraft Mod · Java · StarCraft', desc: 'Terran, Protoss, and Zerg rebuilt as blocks, mobs, and resources, so survival can be played as an RTS match.', cta: ['View on CurseForge', 'https://www.curseforge.com/minecraft/mc-mods/asteriskcraft'] },
      { z: 10, sym: 'Sy', name: 'Sisyphus',   fam: 'play', col: 7, row: 3, mass: 'Vue',
        title: 'Sisyphus Quest', sub: 'Pixel Art · Vue · TypeScript', desc: 'Move right to push the boulder up the hill. If you reach the top, you win!', cta: ['Play now', '/sisyphus-quest/'] },
    ];

    const table = document.getElementById('table');
    const key = document.getElementById('key');

    els.forEach(e => {
      const b = document.createElement('button');
      b.className = 'el' + (e.fam === 'me' ? ' me' : '') + (e.real ? ' real' : '');
      if (e.fam !== 'me') b.style.setProperty('--fc', families[e.fam].color);
      b.style.gridColumn = e.col; b.style.gridRow = e.row;
      b.innerHTML = `<span class="z">${e.z}</span><span class="sym">${e.sym}</span><span class="nm">${e.name}</span><span class="mass">${e.mass}</span>`;
      b.addEventListener('mouseenter', () => inspect(e));
      b.addEventListener('focus', () => inspect(e));
      b.addEventListener('click', () => inspect(e));
      table.appendChild(b);
      e.el = b;
    });

    function inspect(e) {
      els.forEach(x => x.el.classList.toggle('sel', x === e));
      const fam = families[e.fam];
      const color = fam ? fam.color : 'var(--f-me)';
      key.style.setProperty('--fc', color);
      key.innerHTML = `
        <div class="big"><div class="z"><span>${e.z}</span></div><div class="sym">${e.sym}</div><div class="nm">${e.name}</div></div>
        <div>
          <div class="fam">${fam ? `${fam.name} — ${fam.verb}` : 'Element 0 · the author'}</div>
          <h2>${e.title}</h2>
          <div class="sub">${e.sub}</div>
          <p>${e.desc}</p>
          <a class="cta" href="${e.cta[1]}" target="_blank">${e.cta[0]} →</a>
          ${e.real ? `<div class="trivia">Not to be confused with ${e.real}.</div>` : ''}
        </div>`;
    }

    const legend = document.getElementById('legend');
    Object.entries(families).forEach(([k, f]) => {
      const b = document.createElement('button');
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = `<span class="sw" style="--fc:${f.color}"></span><span>${f.name}</span><span class="verb">${f.verb}</span>`;
      b.addEventListener('click', () => {
        const on = b.getAttribute('aria-pressed') !== 'true';
        legend.querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', on);
        table.classList.toggle('filtering', on);
        els.forEach(e => e.el.classList.toggle('lit', on && e.fam === k));
        if (on) inspect(els.find(e => e.fam === k));
      });
      legend.appendChild(b);
    });

    inspect(els[0]);
  </script>
</body>
</html>
