<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup N — Three Rooms</title>
  <!--
    Concept: each category is a room with its own visual language.
      The Library      — Old Books as spines on a wooden shelf; pull one out.
      The Overworld    — Minecraft mods as items in an inventory grid.
      The Cabinet      — Misc projects as labelled specimens in a curiosity cabinet.
    A hallway of three doors switches rooms; the whole page slides sideways.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Press+Start+2P&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #111; color: #f2ece0; font-family: system-ui, sans-serif; }

    /* ── Hallway (top bar) ── */
    .hall {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px;
      background: linear-gradient(#000c, #0000);
    }
    .who { font-family: 'Cormorant Garamond', serif; font-size: 22px; }
    .who small { display: block; font-family: system-ui; font-size: 11px; opacity: 0.65; letter-spacing: 0.03em; }
    .doors { display: flex; gap: 8px; }
    .door {
      position: relative;
      width: 92px; height: 46px;
      border-radius: 46px 46px 4px 4px;
      border: 1px solid #fff3;
      background: #0006;
      color: #f2ece0; font: 600 10px system-ui; letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
      padding-top: 12px;
    }
    .door::after { content: ''; position: absolute; right: 14px; top: 26px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.6; }
    .door:hover { transform: translateY(-2px); }
    .door[aria-selected="true"] { background: var(--dc); border-color: var(--dc); color: #111; }
    .door[data-room="0"] { --dc: #C9A25E; }
    .door[data-room="1"] { --dc: #7FD15B; }
    .door[data-room="2"] { --dc: #E0C9A6; }

    .track { display: flex; width: 300vw; height: 100%; transition: transform 0.8s cubic-bezier(.7,0,.25,1); }
    .room { width: 100vw; height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 90px 24px 40px; }
    .room-title { text-align: center; margin-bottom: 28px; }

    /* ══════════ LIBRARY ══════════ */
    .library {
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, #ffcf7a33, transparent 70%),
        repeating-linear-gradient(90deg, #2a1a0f 0 3px, #2f1d11 3px 7px, #26170d 7px 12px),
        #2a1a0f;
      font-family: 'Cormorant Garamond', serif;
    }
    .library .room-title h2 { font-size: 46px; font-weight: 500; font-style: italic; color: #f3dfb4; }
    .library .room-title p { font-size: 18px; color: #d8c49c; }
    .shelf { position: relative; display: flex; align-items: flex-end; gap: 6px; padding: 0 40px; height: 300px; }
    .shelf::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -18px; height: 18px;
      background: linear-gradient(#6b4423, #3c2412); box-shadow: 0 12px 24px #000a; border-radius: 2px;
    }
    .spine {
      width: var(--w, 58px); height: var(--h, 260px);
      background:
        linear-gradient(90deg, #0004, #fff1 20%, #0000 40%, #0003),
        var(--bc);
      border-radius: 3px 3px 1px 1px;
      box-shadow: inset 0 0 0 1px #0005, 2px 0 4px #0006;
      cursor: pointer;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 0;
      color: #f5e6c4; font-size: 18px; font-weight: 700; letter-spacing: 0.04em;
      transition: translate 0.35s cubic-bezier(.3,1.4,.5,1);
      border: none; font-family: inherit;
    }
    .spine .band { align-self: stretch; inline-size: 3px; margin: 0 8px; background: #d9b36c; box-shadow: 0 6px 0 #d9b36c; }
    .spine:hover, .spine:focus-visible { translate: 0 -18px; outline: none; }
    .spine.out { translate: 0 -40px; }
    .spine.decor { cursor: default; opacity: 0.55; pointer-events: none; }
    .titlepage {
      margin-top: 50px;
      width: min(620px, 100%);
      background: radial-gradient(ellipse at 30% 20%, #f6ecd4, #e6d4ac 70%, #d6bf90); border: 1px solid #b89a64; outline: 1px solid #b89a6466; outline-offset: -8px;
      color: #2b1a0c;
      padding: 22px 30px;
      text-align: center;
      box-shadow: 0 20px 40px #000a;
      border-radius: 2px;
      min-height: 150px;
    }
    .titlepage .tp-year { font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; }
    .titlepage h3 { font-size: 30px; font-weight: 700; margin: 4px 0; }
    .titlepage p { font-size: 17px; line-height: 1.4; }
    .titlepage a { display: inline-block; margin-top: 8px; color: #7a1f12; font-style: italic; font-size: 18px; }

    /* ══════════ OVERWORLD ══════════ */
    .overworld {
      font-family: 'Press Start 2P', monospace;
      background:
        linear-gradient(#0000 68%, #5b8c32 68% 71%, #3e6b22 71% 72%, #79553a 72%),
        linear-gradient(#78a7ff, #a9c9ff 68%);
      image-rendering: pixelated;
    }
    .overworld::before { /* pixel clouds */
      content: ''; position: absolute; top: 120px; left: 0; width: 200%; height: 40px;
      background:
        linear-gradient(#fff, #fff) 10% 0/120px 24px no-repeat,
        linear-gradient(#fff, #fff) 12% 16px/200px 24px no-repeat,
        linear-gradient(#fff, #fff) 55% 10px/160px 24px no-repeat,
        linear-gradient(#fff, #fff) 57% 26px/90px 16px no-repeat;
      opacity: 0.9; animation: drift 80s linear infinite;
    }
    @keyframes drift { to { transform: translateX(-50%); } }
    .overworld .room-title h2 { font-size: 22px; color: #fff; text-shadow: 3px 3px 0 #3f3f3f; line-height: 1.5; }
    .overworld .room-title p { font-size: 10px; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; margin-top: 8px; }
    .inventory {
      position: relative; z-index: 1;
      background: #c6c6c6;
      border: 4px solid; border-color: #fff #555 #555 #fff;
      padding: 14px;
      box-shadow: 0 0 0 4px #000;
    }
    .inventory .inv-label { font-size: 9px; color: #404040; margin-bottom: 10px; }
    .slots { display: grid; grid-template-columns: repeat(9, 52px); gap: 4px; }
    .slot {
      width: 52px; height: 52px;
      background: #8b8b8b;
      border: 3px solid; border-color: #373737 #fff #fff #373737;
      position: relative;
      cursor: default;
      display: grid; place-items: center;
      padding: 0;
    }
    .slot.item { cursor: pointer; }
    .slot.item:hover, .slot.item:focus-visible { background: #c5c5c5; outline: none; }
    .slot img { width: 38px; height: 38px; object-fit: cover; image-rendering: pixelated; }
    .slot .count { position: absolute; right: 2px; bottom: 1px; font-size: 9px; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; }
    .block { width: 34px; height: 34px; box-shadow: inset -4px -4px 0 #0004, inset 4px 4px 0 #fff3; }
    .mc-tooltip {
      position: fixed; z-index: 20; pointer-events: none;
      background: #100010f0;
      border: 3px solid #2a0a5e;
      outline: 2px solid #100010f0;
      padding: 8px 10px;
      max-width: 300px;
      font-family: 'Press Start 2P', monospace; font-size: 9px; line-height: 1.7;
      color: #aaa; display: none;
    }
    .mc-tooltip .t1 { color: #fff; font-size: 10px; }
    .mc-tooltip .t2 { color: #55ffff; }
    .mc-tooltip .t3 { color: #ffaa00; margin-top: 4px; }
    .hotbar-hint { position: relative; z-index: 1; margin-top: 18px; font-size: 9px; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; }

    /* ══════════ CABINET ══════════ */
    .cabinet {
      font-family: 'Special Elite', 'Courier New', monospace;
      background: radial-gradient(ellipse at 50% 30%, #3b2f24, #15100b 80%);
    }
    .cabinet .room-title h2 { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 500; color: #ead9bb; }
    .cabinet .room-title p { font-size: 13px; color: #bfa98a; }
    .drawers {
      display: grid; grid-template-columns: repeat(2, minmax(220px, 300px)); gap: 18px;
      padding: 18px; background: linear-gradient(#5a3b22, #3b2414); border-radius: 6px;
      box-shadow: inset 0 0 0 6px #2a180b, 0 30px 60px #000c;
    }
    .specimen {
      position: relative;
      background: #f3ead6;
      border-radius: 2px;
      padding: 16px 16px 14px;
      color: #2a2015;
      box-shadow: inset 0 0 0 1px #c9b996, inset 0 0 30px #c9b99655;
      text-decoration: none;
      transition: transform 0.25s;
      min-height: 160px;
      display: flex; flex-direction: column;
    }
    .specimen:hover { transform: rotate(-1deg) scale(1.03); }
    .specimen .pin { position: absolute; top: 8px; left: 50%; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--pc) 60%, #000); transform: translateX(-50%); box-shadow: 0 2px 2px #0006; }
    .specimen .art { height: 64px; margin: 8px 0 10px; display: grid; place-items: center; }
    .specimen .label { border-top: 1px solid #2a2015; padding-top: 6px; font-size: 13px; }
    .specimen .label b { display: block; font-size: 15px; }
    .specimen .label i { font-size: 11px; color: #6b5a44; font-style: normal; }
    .specimen .no { position: absolute; top: 8px; right: 10px; font-size: 10px; color: #8a7556; }

    @media (max-width: 760px) {
      .doors .door { width: 64px; font-size: 8px; }
      .who small { display: none; }
      .shelf { gap: 3px; padding: 0 8px; height: 230px; }
      .spine { --w: 42px !important; font-size: 14px; }
      .slots { grid-template-columns: repeat(5, 46px); }
      .slot { width: 46px; height: 46px; }
      .drawers { grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
      .specimen { min-height: 130px; padding: 12px; }
      .room { justify-content: flex-start; overflow-y: auto; }
    }
  </style>
</head>
<body>

  <header class="hall">
    <div class="who">Tim Jasko <small>I read old books and build new things.</small></div>
    <nav class="doors" role="tablist">
      <button class="door" data-room="0" role="tab" aria-selected="true">Library</button>
      <button class="door" data-room="1" role="tab" aria-selected="false">Overworld</button>
      <button class="door" data-room="2" role="tab" aria-selected="false">Cabinet</button>
    </nav>
  </header>

  <main class="track" id="track">

    <!-- LIBRARY -->
    <section class="room library">
      <div class="room-title"><h2>The Library</h2><p>Old books, given new marginalia.</p></div>
      <div class="shelf" id="shelf"></div>
      <div class="titlepage" id="titlepage"></div>
    </section>

    <!-- OVERWORLD -->
    <section class="room overworld">
      <div class="room-title"><h2>The Overworld</h2><p>Minecraft mods, crafted in Java.</p></div>
      <div class="inventory">
        <div class="inv-label">Inventory</div>
        <div class="slots" id="slots"></div>
      </div>
      <div class="hotbar-hint">Hover an item. Click to open on CurseForge.</div>
    </section>

    <!-- CABINET -->
    <section class="room cabinet">
      <div class="room-title"><h2>Cabinet of Curiosities</h2><p>Specimens that defy classification.</p></div>
      <div class="drawers" id="drawers"></div>
    </section>
  </main>

  <div class="mc-tooltip" id="tip"></div>

  <script>
    // ── Library ──
    const books = [
      { title: 'Patristics', year: 'c. 100 – 750 AD', color: '#4a2a6e', h: 270, w: 64, desc: 'Four hundred texts from the early Church Fathers, with 800,000 cross-references extracted by a three-stage AI pipeline.', cta: ['Visit site', 'https://patristics-site.vercel.app/'] },
      { title: 'Two New Sciences', year: 'Galileo · 1638', color: '#8a3c18', h: 240, w: 56, desc: 'Galileo’s final book, with the modern notation, figures, and commentary he couldn’t have had.', cta: ['Read the text', 'https://galileo-two-new-sciences.vercel.app/'] },
      { title: 'Elements', year: 'Euclid · c. 300 BC', color: '#1f5a55', h: 285, w: 70, desc: 'A reading companion for Heath’s translation of Euclid, with explanations on demand for every proposition.', cta: ['Read the text', 'https://euclids-elements-lektor.vercel.app/'] },
      { title: 'Harmonices Mundi', year: 'Kepler · 1619', color: '#6e5d1a', h: 250, w: 58, desc: 'Kepler said the planets make music. Now you can hear what he meant.', cta: ['Hear it now', 'https://kepler-harmonies.vercel.app/'] },
    ];
    const shelf = document.getElementById('shelf');
    const tp = document.getElementById('titlepage');
    const decor = ['#3a2a1a', '#4d1f1f', '#2a3a2a', '#3a3328'];
    function addDecor(i) {
      const d = document.createElement('div');
      d.className = 'spine decor';
      d.style.cssText = `--bc:${decor[i % 4]};--h:${200 + (i * 37) % 70}px;--w:${30 + (i * 13) % 20}px`;
      shelf.appendChild(d);
    }
    addDecor(0);
    books.forEach((b, i) => {
      const s = document.createElement('button');
      s.className = 'spine';
      s.style.cssText = `--bc:${b.color};--h:${b.h}px;--w:${b.w}px`;
      s.innerHTML = `<span class="band"></span>${b.title}<span class="band"></span>`;
      s.addEventListener('click', () => pull(i));
      s.addEventListener('mouseenter', () => pull(i));
      shelf.appendChild(s);
      b.el = s;
      if (i % 2) addDecor(i + 1);
    });
    addDecor(7);
    function pull(i) {
      books.forEach((b, j) => b.el.classList.toggle('out', i === j));
      const b = books[i];
      tp.innerHTML = `<div class="tp-year">${b.year}</div><h3>${b.title}</h3><p>${b.desc}</p><a href="${b.cta[1]}" target="_blank">${b.cta[0]} ☞</a>`;
    }
    pull(0);

    // ── Overworld ──
    const items = [
      { name: 'Zoogoer', img: '../../images/zoogoer.png', lore: 'Villagers who admire your', lore2: 'menagerie and pay you for it.', tag: 'Mod · Java', href: 'https://www.curseforge.com/minecraft/mc-mods/zoogoer' },
      { name: 'AsteriskCraft', img: '../../images/asteriskcraft.png', lore: 'Terran, Protoss, and Zerg', lore2: 'rebuilt as blocks and mobs.', tag: 'Mod · Java · StarCraft', href: 'https://www.curseforge.com/minecraft/mc-mods/asteriskcraft' },
    ];
    const filler = [
      { c: '#866043', n: 'Dirt', q: 64 }, { c: '#7d7d7d', n: 'Cobblestone', q: 32 }, { c: '#b8945f', n: 'Oak Planks', q: 17 },
      { c: '#5d9e32', n: 'Grass Block', q: 8 }, { c: '#e6d7a1', n: 'Old Book (see Library)', q: 4 }, { c: '#2e2e2e', n: 'Coal', q: 9 },
    ];
    const slots = document.getElementById('slots');
    const tip = document.getElementById('tip');
    const total = innerWidth < 760 ? 15 : 27;
    for (let i = 0; i < total; i++) {
      const s = document.createElement('button');
      s.className = 'slot';
      if (i === 0 || i === 1) {
        const it = items[i];
        s.classList.add('item');
        s.innerHTML = `<img src="${it.img}" alt="${it.name}"><span class="count">1</span>`;
        s.onclick = () => window.open(it.href, '_blank');
        s.onmouseenter = () => { tip.innerHTML = `<div class="t1">${it.name}</div><div>${it.lore}</div><div>${it.lore2}</div><div class="t2">${it.tag}</div><div class="t3">Click: View on CurseForge</div>`; tip.style.display = 'block'; };
      } else if ([4, 9, 12, 19, 22, 25].includes(i)) {
        const f = filler[[4, 9, 12, 19, 22, 25].indexOf(i)];
        s.innerHTML = `<span class="block" style="background:${f.c}"></span><span class="count">${f.q}</span>`;
        s.onmouseenter = () => { tip.innerHTML = `<div class="t1">${f.n}</div>`; tip.style.display = 'block'; };
      } else {
        s.onmouseenter = () => (tip.style.display = 'none');
      }
      s.tabIndex = s.classList.contains('item') ? 0 : -1;
      s.onmouseleave = () => (tip.style.display = 'none');
      slots.appendChild(s);
    }
    addEventListener('mousemove', e => { tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY - 10 + 'px'; });

    // ── Cabinet ──
    const specimens = [
      { no: 'No. 001', name: 'Solar Taco Tuesday', latin: 'Tacus tuesdaii planetarius', note: 'Observed weekly on nine worlds.', color: '#D4AE60', href: '../../taco-tuesday/index.html',
        art: '<svg width="64" height="64" viewBox="-32 -32 64 64"><circle r="8" fill="#D4AE60"/><circle r="18" fill="none" stroke="#2a2015" stroke-dasharray="2 3"/><circle r="28" fill="none" stroke="#2a2015" stroke-dasharray="2 3"/><circle cx="18" r="3" fill="#2a2015"/><circle cx="-20" cy="20" r="4" fill="#8a3c18"/></svg>' },
      { no: 'No. 002', name: 'Mandelbrot in Piet', latin: 'Pictura computans', note: 'A program that is also a painting.', color: '#7EC8E3', href: 'https://github.com/bitflora/piet#llms-as-yak-shavers',
        art: '<img src="../../images/mandelbrot.jpg" alt="" style="height:64px;image-rendering:pixelated">' },
      { no: 'No. 003', name: 'Sim Tick', latin: 'Ixodes scapularis (simulated)', note: 'Modelled to find the cheapest way to end Lyme.', color: '#E54B4B', href: 'https://sim-tick.vercel.app/',
        art: '<svg width="64" height="64" viewBox="-10 -10 20 20"><g stroke="#2a2015" stroke-width="0.7" stroke-linecap="round"><line x1="-2.5" y1="-3" x2="-7" y2="-5.5"/><line x1="-2.8" y1="-1" x2="-7.5" y2="-2"/><line x1="-2.8" y1="1" x2="-7.5" y2="2"/><line x1="-2.5" y1="3" x2="-7" y2="5.5"/><line x1="2.5" y1="-3" x2="7" y2="-5.5"/><line x1="2.8" y1="-1" x2="7.5" y2="-2"/><line x1="2.8" y1="1" x2="7.5" y2="2"/><line x1="2.5" y1="3" x2="7" y2="5.5"/></g><ellipse cy="1" rx="3.5" ry="4.5" fill="#5a3a1c"/><circle cy="-3.5" r="1.6" fill="#2a2015"/></svg>' },
      { no: 'No. 004', name: 'Sisyphus Quest', latin: 'Saxum perpetuum', note: 'Push right. Reach the top. Allegedly.', color: '#9a9a9a', href: '/sisyphus-quest/',
        art: '<img src="../../images/sisyphus-quest.gif" alt="" style="height:64px;image-rendering:pixelated">' },
    ];
    const drawers = document.getElementById('drawers');
    specimens.forEach(s => {
      const a = document.createElement('a');
      a.className = 'specimen';
      a.href = s.href; a.target = '_blank';
      a.style.setProperty('--pc', s.color);
      a.innerHTML = `<span class="pin"></span><span class="no">${s.no}</span><div class="art">${s.art}</div><div class="label"><b>${s.name}</b><i>${s.latin}</i><div>${s.note}</div></div>`;
      drawers.appendChild(a);
    });

    // ── Doors ──
    const track = document.getElementById('track');
    document.querySelectorAll('.door').forEach(d => d.addEventListener('click', () => {
      const n = +d.dataset.room;
      track.style.transform = `translateX(-${n * 100}vw)`;
      document.querySelectorAll('.door').forEach(o => o.setAttribute('aria-selected', o === d));
    }));
    addEventListener('keydown', e => {
      const doors = [...document.querySelectorAll('.door')];
      const cur = doors.findIndex(d => d.getAttribute('aria-selected') === 'true');
      if (e.key === 'ArrowRight') doors[Math.min(2, cur + 1)].click();
      if (e.key === 'ArrowLeft')  doors[Math.max(0, cur - 1)].click();
    });
  </script>
</body>
</html>
