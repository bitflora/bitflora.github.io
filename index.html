<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tim Jasko · Collected Works</title>
  <meta name="description" content="The collected works of Tim Jasko, who reads old books and builds new things.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=UnifrakturMaguntia&family=Antonio:wght@400;600&family=Share+Tech+Mono&family=Pixelify+Sans&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: radial-gradient(ellipse at 30% 20%, #f6ecd4, #e9d9b4 60%, #dcc79c);
      --ink: #2a1d10;
      --faded: #6b5638;
      --rubric: #9b2a17;
      --marginal: #3a5f8a;
    }
    html, body { min-height: 100%; background: #1a120b; font-family: 'IM Fell English', Georgia, serif; color: var(--ink); }
    body {
      background: radial-gradient(ellipse at 50% 40%, #3a2716, #120c07 75%);
      display: grid; place-items: center;
      padding: 32px 16px;
      min-height: 100vh;
    }

    /* ── The open book ── */
    .book {
      position: relative;
      display: grid; grid-template-columns: 1fr 1fr;
      width: min(1100px, 100%);
      aspect-ratio: 1.45;
      perspective: 2400px;
      filter: drop-shadow(0 30px 40px #000c);
    }
    .page {
      position: relative;
      background: linear-gradient(90deg, #0000 85%, #0002), var(--paper);
      padding: 48px 52px 52px;
    }
    .page.left  { border-radius: 6px 0 0 6px; box-shadow: inset -30px 0 40px -20px #0005; }
    .page.right { border-radius: 0 6px 6px 0; box-shadow: inset 30px 0 40px -20px #0005; background: linear-gradient(270deg, #0000 85%, #0002), var(--paper); }
    .page::after { /* foxing */
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at 12% 88%, #8a5a2a22 0 3%, transparent 6%),
        radial-gradient(circle at 80% 10%, #8a5a2a1a 0 2%, transparent 5%);
    }
    .folio { position: absolute; bottom: 20px; font-size: 14px; color: var(--faded); }
    .left .folio { left: 52px; } .right .folio { right: 52px; }

    /* ── Title page ── */
    .tp { text-align: center; }
    .tp .the { font-family: 'IM Fell English SC', serif; font-size: 15px; letter-spacing: 0.25em; }
    .tp h1 { font-family: 'UnifrakturMaguntia', serif; font-weight: 400; font-size: 44px; line-height: 1; margin: 4px 0 2px; color: var(--rubric); }
    .tp .of { font-style: italic; font-size: 15px; }
    .tp .author { font-family: 'IM Fell English SC', serif; font-size: 22px; letter-spacing: 0.12em; margin: 2px 0; }
    .tp .desc { font-style: italic; font-size: 14px; color: var(--faded); max-width: 360px; margin: 6px auto 0; line-height: 1.35; }
    .rule { height: 0; border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); margin: 12px auto; width: 70%; padding-top: 3px; }

    .toc { margin-top: 4px; font-size: 15px; }
    .toc .bk { font-family: 'IM Fell English SC', serif; letter-spacing: 0.08em; color: var(--rubric); margin: 8px 0 1px; font-size: 15px; }
    .toc .bk i { font-family: 'IM Fell English', serif; letter-spacing: 0; color: var(--faded); font-size: 13px; }
    .toc a {
      position: relative;
      display: flex; align-items: baseline; gap: 6px;
      color: var(--ink); text-decoration: none;
      padding: 1px 0 1px 16px;
    }
    .toc a .lead { flex: 1; border-bottom: 1px dotted var(--faded); transform: translateY(-4px); min-width: 20px; }
    .toc a:hover .t, .toc a[aria-current="true"] .t { color: var(--rubric); }
    .toc a[aria-current="true"]::before { content: '☞'; position: absolute; left: -4px; color: var(--rubric); }
    .toc a:focus-visible { outline: 1px dashed var(--rubric); outline-offset: 2px; }
    .imprint { margin-top: 14px; text-align: center; font-size: 11px; font-family: 'IM Fell English SC', serif; letter-spacing: 0.12em; color: var(--faded); line-height: 1.6; }
    .imprint a { color: var(--faded); }

    /* ── Chapter page ── */
    .chapter .running { display: flex; justify-content: space-between; font-family: 'IM Fell English SC', serif; font-size: 12px; letter-spacing: 0.15em; color: var(--faded); border-bottom: 1px solid var(--faded); padding-bottom: 4px; margin-bottom: 20px; }
    .chapter .num { font-family: 'IM Fell English SC', serif; text-align: center; font-size: 14px; letter-spacing: 0.3em; }
    .chapter h2 { text-align: center; font-weight: 400; font-size: 30px; line-height: 1.1; margin: 4px 0; }
    .chapter .sub { text-align: center; font-style: italic; font-size: 14px; color: var(--faded); margin-bottom: 18px; }
    .chapter .body { display: grid; grid-template-columns: 1fr 120px; gap: 18px; }
    .chapter p { font-size: 17px; line-height: 1.5; text-align: justify; hyphens: auto; }
    .chapter p::first-letter {
      float: left; font-family: 'UnifrakturMaguntia', serif; color: var(--rubric);
      font-size: 64px; line-height: 0.85; padding: 4px 8px 0 0;
    }
    .marginalia { font-size: 12.5px; font-style: italic; color: var(--faded); line-height: 1.35; border-left: 1px solid #6b563855; padding-left: 10px; }
    .marginalia .hand { font-size: 14px; color: var(--marginal); transform: rotate(-3deg); display: block; margin-top: 14px; }
    .chapter .plate { margin: 16px auto 0; display: block; max-height: 130px; max-width: 70%; filter: sepia(0.7) contrast(1.05); mix-blend-mode: multiply; border: 1px solid var(--ink); padding: 3px; }
    /* Pixel art (the Piet program) keeps its true colours and hard edges */
    .chapter .plate.pixel { height: 130px; filter: none; mix-blend-mode: normal; image-rendering: pixelated; }
    /* A live plate: the orrery itself, shrunk onto the page */
    .chapter .plate-live { margin: 16px auto 0; width: 82%; aspect-ratio: 16 / 9; border: 1px solid var(--ink); padding: 3px; background: #05060c; }
    .chapter .plate-live .viewport { width: 100%; height: 100%; overflow: hidden; position: relative; }
    .chapter .plate-live iframe { position: absolute; top: 0; left: 0; width: 250%; height: 250%; border: 0; transform: scale(0.4); transform-origin: 0 0; }
    .chapter .plate-cap { text-align: center; font-size: 12px; font-style: italic; color: var(--faded); margin-top: 4px; }
    .chapter .tick { position: absolute; top: 0; left: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; cursor: pointer; z-index: 2; }
    .chapter .tick svg { width: 100%; height: 100%; overflow: visible; transition: transform .3s, opacity .3s; }
    .chapter .tick .leg { fill: none; stroke: var(--ink); stroke-width: 0.9; stroke-linejoin: round; stroke-linecap: round; }
    .chapter .tick .body { fill: #6b3f1f; stroke: var(--ink); stroke-width: 0.6; }
    .chapter .tick .scutum, .chapter .tick .mouth { fill: var(--ink); }
    .chapter .tick.walking .leg.a { animation: skitter .16s ease-in-out infinite alternate; }
    .chapter .tick.walking .leg.b { animation: skitter .16s ease-in-out infinite alternate-reverse; }
    @keyframes skitter { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    .chapter .tick.squashed { pointer-events: none; }
    .chapter .tick.squashed svg { transform: scale(1.2, 0.25); opacity: 0; }
    .chapter .cta { display: block; width: fit-content; margin: 14px auto 0; font-family: 'IM Fell English SC', serif; letter-spacing: 0.15em; color: var(--rubric); text-decoration: none; font-size: 15px; }
    .chapter .cta:hover { text-decoration: underline; }
    .finis { text-align: center; font-size: 18px; margin-top: 8px; color: var(--faded); }

    /* ── Turning leaf ── */
    .leaf {
      position: absolute; top: 0; right: 0; width: 50%; height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      pointer-events: none;
      z-index: 5;
      visibility: hidden;
    }
    .leaf.turning { visibility: visible; animation: turn 0.9s cubic-bezier(.45,.05,.35,1) forwards; }
    .leaf .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 0 6px 6px 0; overflow: hidden;
      background: linear-gradient(270deg, #0000 70%, #0003), var(--paper); }
    .leaf .face.chapter { padding: 48px 52px 52px; }
    .leaf .back { transform: rotateY(180deg); border-radius: 6px 0 0 6px; background: linear-gradient(90deg, #0000 70%, #0003), var(--paper); }
    .leaf .plate-stub { margin: 16px auto 0; width: 82%; aspect-ratio: 16 / 9; border: 1px solid var(--ink); background: #05060c; }
    @keyframes turn {
      from { transform: rotateY(0); }
      to   { transform: rotateY(-180deg); }
    }

    .ribbon { position: absolute; top: -6px; left: calc(50% + 30px); width: 18px; height: 70px; background: var(--rubric); z-index: 6; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 85%, 0 100%); box-shadow: 0 2px 4px #0006; }

    /* ══════════════════════════════════════════════════════════════
       Themes. A book may set `theme`; body[data-theme] restyles the
       whole spread while one of its chapters is open.
       ══════════════════════════════════════════════════════════════ */
    .book { z-index: 1; }
    body::before, body::after { /* per-theme backdrops, crossfaded */
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      opacity: 0; transition: opacity 0.5s;
    }
    .book.morphing { animation: morph 0.45s ease-out; }
    @keyframes morph { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
    .device-head, .device-lcd, .mc-done { display: none; }

    /* ── Of the Heavens: a tricorder ── */
    body::after {
      background:
        radial-gradient(ellipse at 50% 45%, #1b2638, #05070b 75%),
        #05070b;
    }
    body[data-theme="tricorder"]::after { opacity: 1; }
    body[data-theme="tricorder"] .book {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 36px; padding: 22px;
      border-radius: 28px;
      background: linear-gradient(165deg, #575b62, #33363b 35%, #1f2124 80%);
      box-shadow: inset 0 2px 0 #ffffff26, inset 0 -3px 0 #0009, 0 0 0 2px #0c0c0e;
    }
    body[data-theme="tricorder"] .ribbon { /* the spine becomes the hinge */
      top: 8%; height: 84%; left: calc(50% - 8px); width: 16px;
      clip-path: none; border-radius: 8px;
      background: repeating-linear-gradient(#2a2c30 0 6px, #4a4e55 6px 8px);
      box-shadow: inset 0 0 0 1px #0008;
    }
    body[data-theme="tricorder"] .leaf { display: none; }
    body[data-theme="tricorder"] .page { border-radius: 14px; box-shadow: none; padding: 20px; }
    body[data-theme="tricorder"] .page::after { background: none; }
    body[data-theme="tricorder"] .folio { display: none; }

    /* left half: keypad */
    body[data-theme="tricorder"] .page.left { background: linear-gradient(#1d1f23, #141518); box-shadow: inset 0 0 0 1px #0008, inset 0 2px 8px #0009; text-align: left; }
    body[data-theme="tricorder"] .tp > .the, body[data-theme="tricorder"] .tp > .of,
    body[data-theme="tricorder"] .tp > .desc, body[data-theme="tricorder"] .tp > .rule,
    body[data-theme="tricorder"] .tp > h1 { display: none; }
    body[data-theme="tricorder"] .tp > .author { font-family: 'Antonio', sans-serif; font-size: 13px; letter-spacing: 0.3em; color: #9aa0a8; text-transform: uppercase; }
    body[data-theme="tricorder"] .device-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .device-head .brand { font-family: 'Antonio', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 0.2em; color: #d7dbe0; }
    .device-head .leds { display: flex; gap: 6px; }
    .device-head .leds i { width: 9px; height: 9px; border-radius: 50%; background: #3a1a12; box-shadow: inset 0 0 0 1px #000; }
    .device-head .leds i:nth-child(1) { background: #ff5a3c; box-shadow: 0 0 8px #ff5a3c; animation: blink 1.1s steps(1) infinite; }
    .device-head .leds i:nth-child(2) { background: #ffcc66; box-shadow: 0 0 6px #ffcc66; }
    .device-head .leds i:nth-child(3) { background: #66ff99; box-shadow: 0 0 6px #66ff99; animation: blink 2.3s steps(1) infinite 0.4s; }
    @keyframes blink { 50% { opacity: 0.2; } }
    body[data-theme="tricorder"] .device-lcd {
      display: block; margin: 10px 0 12px; padding: 8px 10px;
      background: #0b1f14; border-radius: 6px; box-shadow: inset 0 0 0 2px #000, inset 0 0 18px #000;
      font-family: 'Share Tech Mono', monospace; font-size: 13px; line-height: 1.5; color: #66ff99; text-shadow: 0 0 6px #66ff9988;
      white-space: pre;
    }
    body[data-theme="tricorder"] .toc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; margin: 0; }
    body[data-theme="tricorder"] .toc .bk { grid-column: 1 / -1; margin: 6px 0 0; font-family: 'Antonio', sans-serif; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--key); }
    body[data-theme="tricorder"] .toc .bk i { display: none; }
    body[data-theme="tricorder"] .toc a {
      padding: 7px 12px; border-radius: 14px;
      background: var(--key); color: #000;
      font-family: 'Antonio', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em;
      opacity: 0.55; box-shadow: inset 0 -3px 0 #0005;
      transition: opacity 0.15s, box-shadow 0.15s;
    }
    body[data-theme="tricorder"] .toc a .t { color: #000 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    body[data-theme="tricorder"] .toc a .lead { border: 0; }
    body[data-theme="tricorder"] .toc a:hover { opacity: 0.85; }
    body[data-theme="tricorder"] .toc a[aria-current="true"] { opacity: 1; box-shadow: 0 0 12px var(--key), inset 0 -3px 0 #0005; }
    body[data-theme="tricorder"] .toc a[aria-current="true"]::before { content: none; }
    .toc [data-book="I"]   { --key: #ff9966; }
    .toc [data-book="II"]  { --key: #ffcc66; }
    .toc [data-book="III"] { --key: #9999ff; }
    .toc [data-book="IV"]  { --key: #cc99cc; }
    .toc [data-book="A"]   { --key: #66ccff; }
    body[data-theme="tricorder"] .imprint { margin-top: 12px; text-align: left; font-family: 'Share Tech Mono', monospace; letter-spacing: 0.05em; color: #6f7680; }
    body[data-theme="tricorder"] .imprint a { color: #9aa0a8; }

    /* right half: the display */
    body[data-theme="tricorder"] .page.right {
      background: #020305; color: #e8e2d4;
      box-shadow: inset 0 0 0 3px #000, 0 0 0 3px #4a4e55, inset 0 0 40px #0b1a2a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    body[data-theme="tricorder"] .page.right::after { /* scan sweep + scanlines */
      background:
        linear-gradient(#0000 0 45%, #66ccff14 50%, #0000 55%) 0 0/100% 300% no-repeat,
        repeating-linear-gradient(#0000 0 2px, #ffffff06 2px 3px);
      animation: sweep 4s linear infinite;
      border-radius: 14px;
    }
    @keyframes sweep { from { background-position: 0 100%, 0 0; } to { background-position: 0 -100%, 0 0; } }
    .lc-top { display: grid; grid-template-columns: 70px 1fr 30px; gap: 6px; height: 30px; }
    .lc-top .elbow { background: #ff9966; border-radius: 22px 0 0 0; }
    .lc-top .bar { background: #cc99cc; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; font-family: 'Antonio', sans-serif; font-size: 14px; letter-spacing: 0.15em; color: #000; text-transform: uppercase; }
    .lc-top .cap { background: #9999ff; border-radius: 0 15px 15px 0; }
    .lc-frame { display: grid; grid-template-columns: 70px 1fr; gap: 14px; flex: 1; min-height: 0; margin-top: 6px; }
    .lc-side { display: flex; flex-direction: column; gap: 6px; }
    .lc-side span { background: var(--c); color: #000; font-family: 'Antonio', sans-serif; font-size: 12px; text-align: right; padding: 18px 6px 3px; }
    .lc-side span:last-child { flex: 1; border-radius: 0 0 0 22px; }
    .lc-main { min-width: 0; overflow: auto; scrollbar-width: none; padding-top: 4px; }
    .lc-main h2 { font-family: 'Antonio', sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 0.04em; text-transform: uppercase; color: #ff9966; line-height: 1; text-align: left; margin: 0; }
    .lc-main .sub { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #9999ff; text-transform: uppercase; text-align: left; margin: 6px 0 12px; font-style: normal; }
    .lc-main p { font-family: 'Share Tech Mono', monospace; font-size: 14px; line-height: 1.55; text-align: left; hyphens: manual; color: #e8e2d4; }
    .lc-main p::first-letter { float: none; font: inherit; color: inherit; padding: 0; }
    .lc-main .plate { filter: grayscale(1) sepia(1) hue-rotate(160deg) saturate(2.5) brightness(0.9); mix-blend-mode: normal; border-color: #9999ff; max-width: 100%; margin: 12px 0 0; }
    .lc-main .plate-live { margin: 12px 0 0; width: 100%; border-color: #9999ff; }
    .lc-main .plate-cap { text-align: left; color: #9999ff; font-family: 'Share Tech Mono', monospace; font-style: normal; text-transform: uppercase; }
    .lc-notes { margin-top: 10px; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #ffcc66; text-transform: uppercase; }
    .lc-cta { display: inline-block; margin-top: 12px; padding: 6px 18px; border-radius: 15px; background: #ff9966; color: #000; text-decoration: none; font-family: 'Antonio', sans-serif; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; }
    .lc-cta:hover { background: #ffcc66; }
    .lc-wave { height: 26px; margin-top: 8px; overflow: hidden; border-top: 1px solid #9999ff44; }
    .lc-wave svg { width: 200%; height: 100%; animation: wave 3s linear infinite; }
    @keyframes wave { to { transform: translateX(-50%); } }
    .chapter.blip { animation: blip 0.35s steps(4); }
    @keyframes blip { 0% { filter: brightness(2.5) contrast(0.6); } 50% { filter: brightness(0.4); } 100% { filter: none; } }

    /* ── Of Blocks: Minecraft's book screen ── */
    body::before {
      /* the world behind the GUI, blurred and darkened the way the game does it */
      background:
        linear-gradient(#101010c0, #101010d0),
        linear-gradient(90deg, #0000 0 8%, #3c6e2a 8% 14%, #0000 14% 61%, #3c6e2a 61% 69%, #0000 69%) 0 34%/100% 22% no-repeat,
        linear-gradient(90deg, #0000 0 10%, #6b4a2b 10% 12%, #0000 12% 64%, #6b4a2b 64% 66%, #0000 66%) 0 52%/100% 12% no-repeat,
        linear-gradient(#0000 0 58%, #5d9b3a 58% 62%, #7a5232 62% 80%, #6e6e6e 80%),
        linear-gradient(#78a7ff, #a8c8ff 58%);
      filter: blur(6px);
      transform: scale(1.05);
    }
    body[data-theme="blocks"]::before { opacity: 1; }
    body[data-theme="blocks"] .book {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); aspect-ratio: auto;
      gap: 28px;
      width: min(960px, 100%);
      perspective: none; filter: none;
    }
    body[data-theme="blocks"] .ribbon,
    body[data-theme="blocks"] .leaf,
    body[data-theme="blocks"] .folio { display: none; }
    /* Two separate Minecraft books: contents on the left, the chapter on the right */
    body[data-theme="blocks"] .page {
      width: 100%; min-height: 560px;
      border-radius: 0 !important;
      padding: 34px 36px 64px 54px;
      background:
        linear-gradient(90deg, #6b3f1f 0 10px, #8a5530 10px 16px, #c9ae7a 16px 22px, #0000 22px),
        #f3e7c9;
      box-shadow: inset 0 0 0 4px #d6c093, inset -8px 0 0 4px #e8d8b0, 0 0 0 3px #2c1c0c;
      font-family: 'Pixelify Sans', monospace; color: #000;
      image-rendering: pixelated;
    }
    body[data-theme="blocks"] .page::after { background: none; }

    /* contents book */
    body[data-theme="blocks"] .tp { text-align: left; }
    body[data-theme="blocks"] .tp > .rule, body[data-theme="blocks"] .tp > .of { display: none; }
    body[data-theme="blocks"] .tp > .the,
    body[data-theme="blocks"] .tp > h1 { font-family: inherit; font-size: 19px; letter-spacing: 0; color: #000; line-height: 1.3; margin: 0; }
    body[data-theme="blocks"] .tp > .the::before { content: 'Page 1 of 1'; display: block; text-align: right; font-size: 16px; margin-bottom: 14px; }
    body[data-theme="blocks"] .tp > .author { font-family: inherit; font-size: 16px; letter-spacing: 0; color: #555; margin: 0 0 2px; }
    body[data-theme="blocks"] .tp > .author::before { content: 'by '; }
    body[data-theme="blocks"] .tp > .desc { display: none; }
    body[data-theme="blocks"] .tp > h1 { margin-top: 10px; }
    body[data-theme="blocks"] .toc { font-size: 16px; margin-top: 4px; }
    body[data-theme="blocks"] .toc .bk { font-family: inherit; letter-spacing: 0; font-size: 16px; color: #000; margin: 10px 0 2px; }
    body[data-theme="blocks"] .toc .bk i { display: none; }
    body[data-theme="blocks"] .toc a { padding: 1px 0 1px 14px; color: #0000aa; }
    body[data-theme="blocks"] .toc a .t { color: inherit !important; text-decoration: underline; text-underline-offset: 3px; }
    body[data-theme="blocks"] .toc a .lead,
    body[data-theme="blocks"] .toc a > span:last-child { display: none; }
    body[data-theme="blocks"] .toc a:hover { color: #5555ff; }
    body[data-theme="blocks"] .toc a[aria-current="true"] { color: #000; }
    body[data-theme="blocks"] .toc a[aria-current="true"] .t { text-decoration: none; }
    body[data-theme="blocks"] .toc a[aria-current="true"]::before { content: '>'; left: 0; color: #000; }
    body[data-theme="blocks"] .imprint { text-align: left; font-family: inherit; font-size: 14px; letter-spacing: 0; color: #555; margin-top: 18px; }
    body[data-theme="blocks"] .imprint a { color: #0000aa; }

    .mc-pageno { text-align: right; font-size: 16px; color: #000; margin-bottom: 14px; }
    .mc-title { font-size: 19px; margin-bottom: 8px; }
    body[data-theme="blocks"] .chapter p { font-family: 'Pixelify Sans', monospace; font-size: 17px; line-height: 1.45; text-align: left; hyphens: manual; }
    body[data-theme="blocks"] .chapter p::first-letter { float: none; font: inherit; color: inherit; padding: 0; }
    body[data-theme="blocks"] .chapter .plate { filter: none; mix-blend-mode: normal; border: 3px solid #000; padding: 0; max-width: 100%; max-height: 150px; margin: 14px 0 0; image-rendering: pixelated; }
    .mc-note { color: #555 !important; font-size: 15px !important; margin-top: 12px; }
    .mc-link { display: inline-block; margin-top: 10px; color: #0000aa; font-size: 17px; text-decoration: underline; text-underline-offset: 3px; }
    .mc-link:hover { color: #5555ff; }
    .mc-arrow { position: absolute; bottom: 20px; width: 36px; height: 20px; display: block; }
    .mc-arrow.prev { left: 54px; transform: scaleX(-1); }
    .mc-arrow.next { right: 36px; }
    .mc-arrow svg { width: 100%; height: 100%; display: block; }
    .mc-arrow polygon { fill: #c4a875; stroke: #5b4526; stroke-width: 1; }
    .mc-arrow:hover polygon { fill: #f5e2b0; }
    body[data-theme="blocks"] .mc-done {
      display: block; grid-column: 1 / -1; justify-self: center;
      width: min(400px, 100%); margin-top: -8px;
      padding: 8px 0 10px; text-align: center;
      font-family: 'Pixelify Sans', monospace; font-size: 18px; color: #fff; text-decoration: none;
      text-shadow: 2px 2px 0 #3f3f3f;
      background: #727272;
      box-shadow: inset 2px 2px 0 #a8a8a8, inset -2px -3px 0 #4a4a4a, 0 0 0 2px #000;
    }
    body[data-theme="blocks"] .mc-done:hover { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #000; color: #ffffa0; }

    @media (prefers-reduced-motion: reduce) {
      .book.morphing, .chapter.blip, .lc-wave svg, .device-head .leds i { animation: none; }
      body[data-theme="tricorder"] .page.right::after { animation: none; }
    }

    @media (max-width: 860px) {
      body[data-theme="tricorder"] .book { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 14px; }
      body[data-theme="tricorder"] .ribbon { display: none; }
      body[data-theme="tricorder"] .page.right { min-height: 70vh; }
      body[data-theme="blocks"] .book { grid-template-columns: minmax(0, 1fr); gap: 20px; }
      body[data-theme="blocks"] .page { min-height: 0; padding: 28px 22px 64px 40px; }
      body[data-theme="blocks"] .page.right { min-height: 70vh; }
      .mc-arrow.prev { left: 40px; }
      .mc-arrow.next { right: 22px; }
    }

    @media (max-width: 860px) {
      .book { grid-template-columns: 1fr; aspect-ratio: auto; }
      .page { padding: 32px 24px 48px; border-radius: 6px !important; }
      .page.left { margin-bottom: 14px; }
      .leaf, .ribbon { display: none; }
      .chapter .body { grid-template-columns: 1fr; }
      .chapter .plate-live { width: 100%; }
      .left .folio { left: 24px; } .right .folio { right: 24px; }
    }
  </style>
</head>
<body>
  <div class="book">
    <div class="ribbon" aria-hidden="true"></div>

    <section class="page left tp">
      <div class="device-head" aria-hidden="true"><span class="brand">JASKO · TR-4</span><span class="leds"><i></i><i></i><i></i></span></div>
      <div class="the">The Collected Works</div>
      <div class="of">of</div>
      <div class="author">Tim Jasko</div>
      <p class="desc">I read old books &amp; build new things; I cultivate software, but also fruit trees.</p>
      <div class="rule"></div>
      <div class="device-lcd" id="device-lcd" aria-hidden="true"></div>

      <nav class="toc" id="toc" aria-label="Contents"></nav>

      <div class="imprint">
        Printed for the Author<br>
        MMXXVI
      </div>
      <span class="folio">i</span>
    </section>

    <section class="page right chapter" id="chapter" aria-live="polite"></section>
    <a class="mc-done" id="mc-done" href="#">Done</a>

    <div class="leaf" id="leaf" aria-hidden="true"><div class="face chapter" id="leaf-front"></div><div class="face back"></div></div>
  </div>

  <script>
    const books = [
      { n: 'I', title: 'Of Books', gloss: 'wherein ancient texts are made new', chapters: [
        { slug: 'galileo', t: 'Two New Sciences', short: 'Galileo: Two New Sciences', sub: 'Being Galileo’s last book, Anno 1638, newly annotated',
        p: 'Galileo\'s final published work introduced the world to many important new areas of physics. However, it is difficult to read because he lacked the modern mathematical notation that we now take for granted. This showcases using AI to supplement education, by providing inline modern notation, figures, and commentary on a difficult historical text.',
        m: ['An experiment in AI as tutor.'], hand: 'I have discovered a truly marvelous proof that P=NP, which this margin is too narrow to contain.', cta: ['Read the Text', 'https://galileo-two-new-sciences.vercel.app/'] },
        { slug: 'euclid', t: 'Euclid\'s Elements', short: 'Euclid: Elements', sub: 'In Sir Thomas Heath’s translation, with a Companion',
        p: 'A reading companion for the foundational text of geometry. For each proposition an explanation is to be had on demand, so that the modern reader may follow the reasoning without losing the thread.',
        m: ['Q.E.D., but gentler.'], hand: '', cta: ['Read the Text', 'https://euclids-elements-lektor.vercel.app/'] },
        { slug: 'patristics', t: 'Fathers of the Church', short: 'Patristics', sub: 'Four hundred texts, eight hundred thousand cross-references', img: 'images/bible-hyperlink.png',
          p: 'A three-stage AI pipeline that ingests, processes, and semantically indexes writings from the early Church Fathers. This application was built using a combination of Go, Python, SQLite and JavaScript. 400 texts from the past two thousand years were parsed and over 800,000 references were extracted then correlated. Finally these were built into a site that allows easy navigation, lookup, and visualizations of the data.',
          m: ['Go, Python, SQLite, and JavaScript.'], hand: 'Tolle, lege.', cta: ['Visit the Site', 'https://patristics-site.vercel.app/'] },
      ] },
      { n: 'II', title: 'Of the Heavens', gloss: 'encompassing space, music, and tacos', theme: 'tricorder', chapters: [
        { slug: 'kepler', t: 'Of the Harmony of the World', short: 'Kepler\'s Music of the Spheres', sub: 'Harmonices Mundi, Anno 1619, made audible', img: 'images/kepler.jpg',
          p: 'In this critical work Johannes Kepler described the planets as making music, each singing according to its motion. Now, at last, we may hear what that would have sounded like.',
          m: ['Bring headphones.'], hand: 'Earth sings mi-fa-mi.', cta: ['Hear It Now', 'https://kepler-harmonies.vercel.app/'] },
        { slug: 'taco', t: 'Of Tacos upon the Planets', short: 'Solar Taco Tuesday', sub: 'An orrery for a weekly feast', live: 'taco-tuesday/index.html',
          p: 'Suppose you are an interstellar traveler. Suppose you are hungry. Wouldn’t it be handy to know where it is currently Taco Tuesday? Use this helpful tool!',
          m: ['Pluto is a planet here.'], hand: 'Disputed.', cta: ['Behold your solar system', 'taco-tuesday/index.html'] },
      ] },
      { n: 'III', title: 'Of Blocks', gloss: 'being modifications to the game Minecraft', theme: 'blocks', chapters: [
        { slug: 'asteriskcraft', t: 'Of the Three Races of the Stars', short: 'AsteriskCraft', sub: 'StarCraft brought into the Overworld', img: 'images/asteriskcraft.png',
          p: 'A Minecraft mod that brings StarCraft into the Overworld. The three races and their tech trees — Terran, Protoss, and Zerg — are rebuilt as blocks, mobs, and resources, so a survival world can be played as an RTS match.',
          m: ['You must construct additional pylons.'], hand: 'GG', cta: ['View at CurseForge', 'https://www.curseforge.com/minecraft/mc-mods/asteriskcraft'] },
        { slug: 'zoogoer', t: 'Of Zoos & Their Admirers', short: 'Zoogoer', sub: 'A modification, written in Java', img: 'images/zoogoer.png',
          p: 'A Minecraft mod that adds new villagers who will admire the creatures you\'ve collected and reward you for a well-built zoo.',
          m: ['Feed the animals.'], hand: '', cta: ['View at CurseForge', 'https://www.curseforge.com/minecraft/mc-mods/zoogoer'] },
        { slug: 'ultimate-zookeeper', t: 'Of the Penultimate Zookeeper', short: 'The Ultimate Zookeeper', sub: 'A modpack, for Forge 1.20.1', img: 'images/ultimate-zookeeper.png',
          p: 'A Minecraft challenge pack. Building from a small farm, the player collects ever more exotic beasts, up to the resurrection of dinosaurs from their fossils. A well-kept zoo draws Zoogoers, whose emeralds fund further research, and the animals themselves grant new abilities, all in service of bringing back the Ultimate Zookeeper.',
          m: ['Rats as workers.', 'Dinosaurs from DNA.'], hand: 'Crikey!', cta: ['View at CurseForge', 'https://www.curseforge.com/minecraft/modpacks/the-ultimate-zookeeper'] },
      ] },
      { n: 'IV', title: 'Of Divers Curiosities', gloss: 'which resist all classification', chapters: [
        { slug: 'piet', t: 'A Painting that Computes', short: 'Mandelbrot in Piet', sub: 'The Mandelbrot set, writ in colour', img: 'images/pretty.png', pixel: true,
          p: 'Piet is an esoteric programming language where programs are abstract paintings and instructions are encoded as color transitions between blocks. In writing the displayed program, I explored the utility of LLMs in building tools that let a developer focus on the central task.',
          m: ['Sort of a Quine.'], hand: 'On yak-shaving.', cta: ['Read the Retrospective', 'https://github.com/bitflora/piet#llms-as-yak-shavers'] },
        { slug: 'sim-tick', t: 'Of the Tick, & How to Be Rid of It', short: 'Sim Tick', sub: 'A simulation drawn from the latest research',
          p: 'An accurate tick lifecycle simulator built from the latest scientific research. The goal: find efficient ways to exterminate Lyme disease by modeling tick populations under different intervention strategies.',
          m: ['TypeScript.'], hand: 'Check your ankles.', cta: ['Visit the Site', 'https://sim-tick.vercel.app/'], ticks: 3 },
        { slug: 'sisyphus', t: 'Of Sisyphus & His Stone', short: 'Sisyphus Quest', sub: 'A game in the manner of pixels', img: 'images/sisyphus-quest.gif',
          p: 'A simple JavaScript game inspired by the myth of Sisyphus. Move Right to push the boulder up the hill. If you reach the top, you win!',
          m: ['Vue & TypeScript.'], hand: 'One must imagine him happy.', cta: ['Play Now', 'sisyphus-quest/'] },
      ] },
      { title: 'Of the Author', gloss: '& where he may be found', chapters: [
        { short: 'GitHub', href: 'https://github.com/bitflora' },
        { short: 'LinkedIn', href: 'https://www.linkedin.com/in/timothy-jasko-4536816/' },
        { short: 'Email', href: 'mailto:tim.jasko@gmail.com' },
      ] },
    ];

    const PAGES_PER_CHAPTER = 8;
    const toc       = document.getElementById('toc');
    const chapterEl = document.getElementById('chapter');
    const leaf      = document.getElementById('leaf');
    const leafFront = document.getElementById('leaf-front');
    const bookEl    = document.querySelector('.book');
    const doneEl    = document.getElementById('mc-done');
    const calm      = matchMedia('(prefers-reduced-motion: reduce)');
    const narrow    = matchMedia('(max-width: 860px)');
    const flat      = [];

    books.forEach(b => {
      const h = document.createElement('div');
      h.className = 'bk';
      b.head = b.n ? `Book ${b.n}` : 'Appendix';
      h.dataset.book = b.n || 'A';
      h.innerHTML = `${b.head}. ${b.title}<i>, ${b.gloss}</i>`;
      toc.appendChild(h);
      b.chapters.forEach((c, i) => {
        // An entry with `href` leads out of the book rather than to a chapter
        if (c.href) {
          const a = document.createElement('a');
          a.href = c.href;
          a.target = '_blank';
          a.dataset.book = b.n || 'A';
          a.innerHTML = `<span class="t">${c.short}</span><span class="lead"></span><span>↗</span>`;
          toc.appendChild(a);
          return;
        }
        c.book = b;
        c.idx = i;
        c.page = flat.length * PAGES_PER_CHAPTER + 1;
        const a = document.createElement('a');
        a.href = '#' + c.slug;
        a.dataset.book = b.n || 'A';
        a.innerHTML = `<span class="t">${c.short}</span><span class="lead"></span><span>${c.page}</span>`;
        toc.appendChild(a);
        c.link = a;
        flat.push(c);
      });
    });

    const roman = n => ['i', 'ii', 'iii', 'iv', 'v', 'vi'][n] || n;

    function plate(c) {
      if (c.live) {
        return `<div class="plate-live"><div class="viewport"><iframe src="${c.live}" title="${c.short}, running live" scrolling="no" loading="lazy"></iframe></div></div>
          <div class="plate-cap">Fig. The orrery, in motion.</div>`;
      }
      return c.img ? `<img class="plate${c.pixel ? ' pixel' : ''}" src="${c.img}" alt="">` : '';
    }

    const themeOf = c => c.book.theme || 'book';

    // Sim Tick: a few ticks wander the page, and a click is one means of being rid of them
    const tickSvg = (() => {
      // [start, knee, foot] for each left leg; the right side mirrors it. Head points up.
      const legs = [[-3, -2.5, -7, -6, -8, -10], [-4, -0.5, -8, -2, -11, -1], [-4, 2, -8, 3, -11, 6], [-3, 4.5, -6, 7, -8, 11]];
      const path = ([sx, sy, kx, ky, ex, ey], m, gait) => `<path class="leg ${gait}" d="M${sx * m} ${sy} L${kx * m} ${ky} L${ex * m} ${ey}"/>`;
      return `<svg viewBox="-12 -12 24 24" aria-hidden="true">
        ${legs.map((l, i) => path(l, 1, i % 2 ? 'a' : 'b') + path(l, -1, i % 2 ? 'b' : 'a')).join('')}
        <path class="mouth" d="M-1.6 -3.5 L0 -8.5 L1.6 -3.5Z"/>
        <ellipse class="body" cy="2.5" rx="4.6" ry="6"/>
        <ellipse class="scutum" cy="-1" rx="3.2" ry="2.8"/></svg>`;
    })();

    function spawnTicks(n) {
      const W = () => chapterEl.clientWidth, H = () => chapterEl.clientHeight, PAD = 16;
      const ticks = Array.from({ length: n }, () => {
        const el = document.createElement('div');
        el.className = 'tick';
        el.innerHTML = tickSvg;
        el.addEventListener('click', () => el.classList.add('squashed'), { once: true });
        chapterEl.appendChild(el);
        return { el, x: PAD + Math.random() * (W() - 2 * PAD), y: PAD + Math.random() * (H() - 2 * PAD),
                 heading: Math.random() * 2 * Math.PI, speed: 14 + Math.random() * 10, restUntil: 0 };
      });
      const place = t => t.el.style.transform = `translate(${t.x}px, ${t.y}px) rotate(${t.heading + Math.PI / 2}rad)`;
      ticks.forEach(place);
      if (calm.matches) return;

      let last = performance.now();
      requestAnimationFrame(function step(now) {
        const live = ticks.filter(t => t.el.isConnected && !t.el.classList.contains('squashed'));
        if (!live.length) return; // page re-rendered, or all dispatched
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        live.forEach(t => {
          const resting = now < t.restUntil;
          t.el.classList.toggle('walking', !resting);
          if (resting) return;
          if (Math.random() < dt * 0.25) { t.restUntil = now + 600 + Math.random() * 2000; return; }
          t.heading += (Math.random() - 0.5) * 6 * dt;
          // Near an edge, bend back toward the middle of the page
          if (t.x < PAD || t.x > W() - PAD || t.y < PAD || t.y > H() - PAD) {
            const home = Math.atan2(H() / 2 - t.y, W() / 2 - t.x);
            t.heading += Math.sin(home - t.heading) * 4 * dt;
          }
          t.x += Math.cos(t.heading) * t.speed * dt;
          t.y += Math.sin(t.heading) * t.speed * dt;
          place(t);
        });
        requestAnimationFrame(step);
      });
    }

    // A tiny inline pixel arrow for the Minecraft page-turn buttons
    const mcArrow = '<svg viewBox="0 0 18 10" shape-rendering="crispEdges"><polygon points="0,3 10,3 10,0 18,5 10,10 10,7 0,7"/></svg>';
    const waveSvg = (() => {
      let d = 'M0 13';
      for (let x = 0; x < 400; x += 20) d += ` Q${x + 5} ${x % 40 ? 2 : 24} ${x + 10} 13 T${x + 20} 13`;
      return `<svg viewBox="0 0 400 26" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#66ccff" stroke-width="1.5"/></svg>`;
    })();

    const templates = {
      book: c => `
        <div class="running"><span>${c.book.head}</span><span>${c.book.title.replace('Of ', '')}</span></div>
        <div class="num">Chapter ${roman(c.idx)}</div>
        <h2>${c.t}</h2>
        <div class="sub">${c.sub}</div>
        <div class="body">
          <div><p>${c.p}</p>${plate(c)}</div>
          <aside class="marginalia">${c.m.join('<br>')}${c.hand ? `<span class="hand">${c.hand}</span>` : ''}</aside>
        </div>
        <a class="cta" href="${c.cta[1]}" target="_blank">☞ ${c.cta[0]} ☜</a>
        <div class="finis">❧</div>
        <span class="folio">${c.page}</span>`,

      tricorder: c => `
        <div class="lc-top"><span class="elbow"></span><span class="bar">${c.book.title.replace('Of ', '')} · ${c.book.n}-${String(c.idx + 1).padStart(2, '0')}</span><span class="cap"></span></div>
        <div class="lc-frame">
          <div class="lc-side">
            <span style="--c:#ff9966">${String(c.page).padStart(3, '0')}</span>
            <span style="--c:#cc99cc">${c.slug.length * 47}</span>
            <span style="--c:#9999ff">${roman(c.idx).toUpperCase()}</span>
            <span style="--c:#ffcc66"></span>
          </div>
          <div class="lc-main">
            <h2>${c.short}</h2>
            <div class="sub">${c.sub}</div>
            <p>${c.p}</p>
            ${plate(c)}
            <div class="lc-notes">${[...c.m, c.hand].filter(Boolean).join(' · ')}</div>
            <a class="lc-cta" href="${c.cta[1]}" target="_blank">${c.cta[0]}</a>
          </div>
        </div>
        <div class="lc-wave" aria-hidden="true">${waveSvg}</div>`,

      blocks: c => {
        const chs = c.book.chapters, prev = chs[c.idx - 1], next = chs[c.idx + 1];
        return `
        <div class="mc-pageno">Page ${c.idx + 1} of ${chs.length}</div>
        <div class="mc-title">${c.short}</div>
        <p>${c.p}</p>
        ${plate(c)}
        <p class="mc-note">${[...c.m, c.hand].filter(Boolean).join(' ')}</p>
        <a class="mc-link" href="${c.cta[1]}" target="_blank">${c.cta[0]}</a>
        ${prev ? `<a class="mc-arrow prev" href="#${prev.slug}" aria-label="Previous page">${mcArrow}</a>` : ''}
        ${next ? `<a class="mc-arrow next" href="#${next.slug}" aria-label="Next page">${mcArrow}</a>` : ''}`;
      },
    };

    function render(c) {
      flat.forEach(x => x.link.setAttribute('aria-current', x === c));
      chapterEl.innerHTML = templates[themeOf(c)](c);
      if (c.ticks) spawnTicks(c.ticks);
      chapterEl.querySelector('.plate-live iframe')?.addEventListener('load', e => {
        // At plate size the orrery's settings panel would cover half the figure
        try {
          const s = e.target.contentDocument.createElement('style');
          s.textContent = '#control-panel { display: none; }';
          e.target.contentDocument.head.appendChild(s);
        } catch { /* cross-origin in some deploys; the panel just stays */ }
      });
    }

    // Swap theme and content in one go; `effect` is the transition to play, if any
    function show(c, effect) {
      document.body.dataset.theme = themeOf(c);
      render(c);
      tickLcd();
      if (calm.matches || !effect) return;
      const el = effect === 'morph' ? bookEl : chapterEl;
      const cls = effect === 'morph' ? 'morphing' : 'blip';
      el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    }

    let current = null;
    let lastOutsideBlocks = flat[0];
    let busy = false;
    function turnTo(c) {
      if (!c || c === current || busy) return;
      const prev = current;
      current = c;
      if (themeOf(c) !== 'blocks') lastOutsideBlocks = c;
      doneEl.href = '#' + lastOutsideBlocks.slug;

      if (!prev) { show(c); return; }
      const themeChanged = themeOf(prev) !== themeOf(c);
      const effect = themeChanged ? 'morph' : themeOf(c) === 'tricorder' ? 'blip' : null;
      if (narrow.matches) { show(c, effect); chapterEl.scrollIntoView({ behavior: 'smooth' }); return; }
      if (themeChanged || themeOf(c) !== 'book' || calm.matches) { show(c, effect); return; }

      // book → book: turn the page
      busy = true;
      // Copy the outgoing page onto the leaf, but don't spin up a second live iframe
      leafFront.innerHTML = chapterEl.innerHTML;
      leafFront.querySelectorAll('.plate-live').forEach(el => el.outerHTML = '<div class="plate-stub"></div>');
      leaf.classList.remove('turning'); void leaf.offsetWidth; leaf.classList.add('turning');
      render(c);
      setTimeout(() => {
        leaf.classList.remove('turning');
        busy = false;
        turnTo(fromHash()); // catch up if the hash moved mid-turn
      }, 900);
    }

    // Tricorder readout: local time and the countdown that matters
    const lcd = document.getElementById('device-lcd');
    function tickLcd() {
      if (document.body.dataset.theme !== 'tricorder') return;
      const now = new Date();
      const days = (2 - now.getDay() + 7) % 7;
      lcd.textContent =
        `LOCAL  ${now.toTimeString().slice(0, 8)}\n` +
        (days ? `TUESDAY IN ${days} DAY${days > 1 ? 'S' : ''}` : 'IT IS TUESDAY. EAT.');
    }
    setInterval(tickLcd, 1000);

    const fromHash = () => flat.find(c => '#' + c.slug === location.hash) || flat[0];
    addEventListener('hashchange', () => turnTo(fromHash()));

    addEventListener('keydown', e => {
      if (e.target.closest('input, textarea')) return;
      const i = flat.indexOf(current);
      if (e.key === 'ArrowRight' && i < flat.length - 1) location.hash = flat[i + 1].slug;
      if (e.key === 'ArrowLeft'  && i > 0)               location.hash = flat[i - 1].slug;
    });

    turnTo(fromHash());
    tickLcd();
  </script>
</body>
</html>
