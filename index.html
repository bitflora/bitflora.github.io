<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tim Jasko · Collected Works</title>
  <meta name="description" content="The collected works of Tim Jasko, who reads old books and builds new things.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: radial-gradient(ellipse at 30% 20%, #f6ecd4, #e9d9b4 60%, #dcc79c);
      --ink: #2a1d10;
      --faded: #6b5638;
      --rubric: #9b2a17;
      --marginal: #3a5f8a;
    }
    html, body { min-height: 100%; background: #1a120b; font-family: 'IM Fell English', Georgia, serif; color: var(--ink); }
    body {
      background: radial-gradient(ellipse at 50% 40%, #3a2716, #120c07 75%);
      display: grid; place-items: center;
      padding: 32px 16px;
      min-height: 100vh;
    }

    /* ── The open book ── */
    .book {
      position: relative;
      display: grid; grid-template-columns: 1fr 1fr;
      width: min(1100px, 100%);
      aspect-ratio: 1.45;
      perspective: 2400px;
      filter: drop-shadow(0 30px 40px #000c);
    }
    .page {
      position: relative;
      background: linear-gradient(90deg, #0000 85%, #0002), var(--paper);
      padding: 48px 52px 52px;
    }
    .page.left  { border-radius: 6px 0 0 6px; box-shadow: inset -30px 0 40px -20px #0005; }
    .page.right { border-radius: 0 6px 6px 0; box-shadow: inset 30px 0 40px -20px #0005; background: linear-gradient(270deg, #0000 85%, #0002), var(--paper); }
    .page::after { /* foxing */
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at 12% 88%, #8a5a2a22 0 3%, transparent 6%),
        radial-gradient(circle at 80% 10%, #8a5a2a1a 0 2%, transparent 5%);
    }
    .folio { position: absolute; bottom: 20px; font-size: 14px; color: var(--faded); }
    .left .folio { left: 52px; } .right .folio { right: 52px; }

    /* ── Title page ── */
    .tp { text-align: center; }
    .tp .the { font-family: 'IM Fell English SC', serif; font-size: 15px; letter-spacing: 0.25em; }
    .tp h1 { font-family: 'UnifrakturMaguntia', serif; font-weight: 400; font-size: 44px; line-height: 1; margin: 4px 0 2px; color: var(--rubric); }
    .tp .of { font-style: italic; font-size: 15px; }
    .tp .author { font-family: 'IM Fell English SC', serif; font-size: 22px; letter-spacing: 0.12em; margin: 2px 0; }
    .tp .desc { font-style: italic; font-size: 14px; color: var(--faded); max-width: 360px; margin: 6px auto 0; line-height: 1.35; }
    .rule { height: 0; border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); margin: 12px auto; width: 70%; padding-top: 3px; }

    .toc { margin-top: 4px; font-size: 15px; }
    .toc .bk { font-family: 'IM Fell English SC', serif; letter-spacing: 0.08em; color: var(--rubric); margin: 8px 0 1px; font-size: 15px; }
    .toc .bk i { font-family: 'IM Fell English', serif; letter-spacing: 0; color: var(--faded); font-size: 13px; }
    .toc a {
      position: relative;
      display: flex; align-items: baseline; gap: 6px;
      color: var(--ink); text-decoration: none;
      padding: 1px 0 1px 16px;
    }
    .toc a .lead { flex: 1; border-bottom: 1px dotted var(--faded); transform: translateY(-4px); min-width: 20px; }
    .toc a:hover .t, .toc a[aria-current="true"] .t { color: var(--rubric); }
    .toc a[aria-current="true"]::before { content: '☞'; position: absolute; left: -4px; color: var(--rubric); }
    .toc a:focus-visible { outline: 1px dashed var(--rubric); outline-offset: 2px; }
    .imprint { margin-top: 14px; text-align: center; font-size: 11px; font-family: 'IM Fell English SC', serif; letter-spacing: 0.12em; color: var(--faded); line-height: 1.6; }
    .imprint a { color: var(--faded); }

    /* ── Chapter page ── */
    .chapter .running { display: flex; justify-content: space-between; font-family: 'IM Fell English SC', serif; font-size: 12px; letter-spacing: 0.15em; color: var(--faded); border-bottom: 1px solid var(--faded); padding-bottom: 4px; margin-bottom: 20px; }
    .chapter .num { font-family: 'IM Fell English SC', serif; text-align: center; font-size: 14px; letter-spacing: 0.3em; }
    .chapter h2 { text-align: center; font-weight: 400; font-size: 30px; line-height: 1.1; margin: 4px 0; }
    .chapter .sub { text-align: center; font-style: italic; font-size: 14px; color: var(--faded); margin-bottom: 18px; }
    .chapter .body { display: grid; grid-template-columns: 1fr 120px; gap: 18px; }
    .chapter p { font-size: 17px; line-height: 1.5; text-align: justify; hyphens: auto; }
    .chapter p::first-letter {
      float: left; font-family: 'UnifrakturMaguntia', serif; color: var(--rubric);
      font-size: 64px; line-height: 0.85; padding: 4px 8px 0 0;
    }
    .marginalia { font-size: 12.5px; font-style: italic; color: var(--faded); line-height: 1.35; border-left: 1px solid #6b563855; padding-left: 10px; }
    .marginalia .hand { font-size: 14px; color: var(--marginal); transform: rotate(-3deg); display: block; margin-top: 14px; }
    .chapter .plate { margin: 16px auto 0; display: block; max-height: 130px; max-width: 70%; filter: sepia(0.7) contrast(1.05); mix-blend-mode: multiply; border: 1px solid var(--ink); padding: 3px; }
    /* A live plate: the orrery itself, shrunk onto the page */
    .chapter .plate-live { margin: 16px auto 0; width: 82%; aspect-ratio: 16 / 9; border: 1px solid var(--ink); padding: 3px; background: #05060c; }
    .chapter .plate-live .viewport { width: 100%; height: 100%; overflow: hidden; position: relative; }
    .chapter .plate-live iframe { position: absolute; top: 0; left: 0; width: 250%; height: 250%; border: 0; transform: scale(0.4); transform-origin: 0 0; }
    .chapter .plate-cap { text-align: center; font-size: 12px; font-style: italic; color: var(--faded); margin-top: 4px; }
    .chapter .cta { display: block; width: fit-content; margin: 14px auto 0; font-family: 'IM Fell English SC', serif; letter-spacing: 0.15em; color: var(--rubric); text-decoration: none; font-size: 15px; }
    .chapter .cta:hover { text-decoration: underline; }
    .finis { text-align: center; font-size: 18px; margin-top: 8px; color: var(--faded); }

    /* ── Turning leaf ── */
    .leaf {
      position: absolute; top: 0; right: 0; width: 50%; height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      pointer-events: none;
      z-index: 5;
      visibility: hidden;
    }
    .leaf.turning { visibility: visible; animation: turn 0.9s cubic-bezier(.45,.05,.35,1) forwards; }
    .leaf .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 0 6px 6px 0; overflow: hidden;
      background: linear-gradient(270deg, #0000 70%, #0003), var(--paper); }
    .leaf .face.chapter { padding: 48px 52px 52px; }
    .leaf .back { transform: rotateY(180deg); border-radius: 6px 0 0 6px; background: linear-gradient(90deg, #0000 70%, #0003), var(--paper); }
    .leaf .plate-stub { margin: 16px auto 0; width: 82%; aspect-ratio: 16 / 9; border: 1px solid var(--ink); background: #05060c; }
    @keyframes turn {
      from { transform: rotateY(0); }
      to   { transform: rotateY(-180deg); }
    }

    .ribbon { position: absolute; top: -6px; left: calc(50% + 30px); width: 18px; height: 70px; background: var(--rubric); z-index: 6; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 85%, 0 100%); box-shadow: 0 2px 4px #0006; }

    @media (max-width: 860px) {
      .book { grid-template-columns: 1fr; aspect-ratio: auto; }
      .page { padding: 32px 24px 48px; border-radius: 6px !important; }
      .page.left { margin-bottom: 14px; }
      .leaf, .ribbon { display: none; }
      .chapter .body { grid-template-columns: 1fr; }
      .chapter .plate-live { width: 100%; }
      .left .folio { left: 24px; } .right .folio { right: 24px; }
    }
  </style>
</head>
<body>
  <div class="book">
    <div class="ribbon" aria-hidden="true"></div>

    <section class="page left tp">
      <div class="the">The Collected Works</div>
      <div class="of">of</div>
      <div class="author">Tim Jasko</div>
      <p class="desc">Who readeth old books &amp; buildeth new things; who cultivateth software, but also fruit trees.</p>
      <div class="rule"></div>
      <h1>In Four Books</h1>

      <nav class="toc" id="toc" aria-label="Contents"></nav>

      <div class="imprint">
        Printed for the Author, and sold at
        <a href="https://github.com/bitflora" target="_blank">GitHub</a>,
        <a href="https://www.linkedin.com/in/timothy-jasko-4536816/" target="_blank">LinkedIn</a>, &amp;
        <a href="mailto:tim.jasko@gmail.com">by Post</a><br>
        MMXXVI
      </div>
      <span class="folio">i</span>
    </section>

    <section class="page right chapter" id="chapter" aria-live="polite"></section>

    <div class="leaf" id="leaf" aria-hidden="true"><div class="face chapter" id="leaf-front"></div><div class="face back"></div></div>
  </div>

  <script>
    const books = [
      { n: 'I', title: 'Of Old Books', gloss: 'wherein ancient texts are made new', chapters: [
        { slug: 'patristics', t: 'Of the Fathers of the Church', short: 'Patristics', sub: 'Four hundred texts, eight hundred thousand cross-references', img: 'images/bible-hyperlink.png',
          p: 'A three-stage pipeline, aided by artificial intelligence, that ingests, processes, and indexes the writings of the early Church Fathers. Some four hundred texts spanning two thousand years were parsed, and above eight hundred thousand references drawn out and correlated, then bound into a site for easy navigation and lookup.',
          m: ['Go, Python, SQLite, and JavaScript.'], hand: 'Tolle, lege.', cta: ['Visit the Site', 'https://patristics-site.vercel.app/'] },
        { slug: 'galileo', t: 'Of Two New Sciences', short: 'Galileo', sub: 'Being Galileo’s last book, Anno 1638, newly annotated',
          p: 'Galileo’s final published work opened whole new provinces of physics, yet it is hard reading, for he lacked the mathematical notation we now take for granted. Here modern notation, figures, and commentary are supplied inline, that a student might follow him.',
          m: ['An experiment in AI as tutor.'], hand: 'He would have liked LaTeX.', cta: ['Read the Text', 'https://galileo-two-new-sciences.vercel.app/'] },
        { slug: 'euclid', t: 'Of the Elements of Euclid', short: 'Euclid', sub: 'In Sir Thomas Heath’s translation, with a Companion',
          p: 'A reading companion for the foundational text of geometry. For each proposition an explanation is to be had on demand, so that the modern reader may follow the reasoning without losing the thread.',
          m: ['Q.E.D., but gentler.'], hand: '', cta: ['Read the Text', 'https://euclids-elements-lektor.vercel.app/'] },
      ] },
      { n: 'II', title: 'Of the Heavens', gloss: 'wherein the planets keep time, & sing', chapters: [
        { slug: 'kepler', t: 'Of the Harmony of the World', short: 'Kepler', sub: 'Harmonices Mundi, Anno 1619, made audible', img: 'images/kepler.jpg',
          p: 'In this critical work Johannes Kepler described the planets as making music, each singing according to its motion. Now, at last, we may hear what that would have sounded like.',
          m: ['Bring headphones.'], hand: 'Earth sings mi-fa-mi.', cta: ['Hear It Now', 'https://kepler-harmonies.vercel.app/'] },
        { slug: 'taco', t: 'Of Tacos upon the Planets', short: 'Solar Taco Tuesday', sub: 'An orrery for a weekly feast', live: 'taco-tuesday/index.html',
          p: 'Every Tuesday, somewhere in the solar system, it is Taco Tuesday. Orbital mechanics are computed across all nine planets, from Mercury’s year of eighty-eight days to Pluto’s of two hundred forty-eight years.',
          m: ['Pluto is a planet here.'], hand: 'Disputed.', cta: ['Behold the Orrery', 'taco-tuesday/index.html'] },
      ] },
      { n: 'III', title: 'Of Blocks', gloss: 'being modifications to the game Minecraft', chapters: [
        { slug: 'zoogoer', t: 'Of Zoos & Their Admirers', short: 'Zoogoer', sub: 'A modification, written in Java', img: 'images/zoogoer.png',
          p: 'New villagers are introduced to the world, who come to admire the creatures you have collected, and who reward the keeper of a well-built zoo.',
          m: ['Feed the animals.'], hand: '', cta: ['View at CurseForge', 'https://www.curseforge.com/minecraft/mc-mods/zoogoer'] },
        { slug: 'asteriskcraft', t: 'Of the Three Races of the Stars', short: 'AsteriskCraft', sub: 'StarCraft brought into the Overworld', img: 'images/asteriskcraft.png',
          p: 'Terran, Protoss, and Zerg, together with their trees of technology, are rebuilt as blocks, mobs, and resources, so that a survival world may be played as a match of real-time strategy.',
          m: ['You must construct additional pylons.'], hand: 'GG', cta: ['View at CurseForge', 'https://www.curseforge.com/minecraft/mc-mods/asteriskcraft'] },
      ] },
      { n: 'IV', title: 'Of Divers Curiosities', gloss: 'which resist all classification', chapters: [
        { slug: 'piet', t: 'Of a Painting that Computes', short: 'Piet', sub: 'The Mandelbrot set, writ in colour', img: 'images/mandelbrot.jpg',
          p: 'Piet is a language wherein programs are abstract paintings and instructions are encoded as changes of colour between blocks. In painting this one, the author made trial of LLMs as builders of tools, that he might keep to the central task.',
          m: ['Rust & Python for the tools.'], hand: 'On yak-shaving.', cta: ['Read the Retrospective', 'https://github.com/bitflora/piet#llms-as-yak-shavers'] },
        { slug: 'sim-tick', t: 'Of the Tick, & How to Be Rid of It', short: 'Sim Tick', sub: 'A simulation drawn from the latest research',
          p: 'An accurate simulator of the life of the tick, built upon recent science, whose purpose is to find efficient means of exterminating the Lyme disease by modelling tick populations under divers interventions.',
          m: ['TypeScript.'], hand: 'Check your ankles.', cta: ['Visit the Site', 'https://sim-tick.vercel.app/'] },
        { slug: 'sisyphus', t: 'Of Sisyphus & His Stone', short: 'Sisyphus Quest', sub: 'A game in the manner of pixels', img: 'images/sisyphus-quest.gif',
          p: 'A simple game after the myth of Sisyphus. Move right to push the boulder up the hill. Should you reach the top, you win.',
          m: ['Vue & TypeScript.'], hand: 'One must imagine him happy.', cta: ['Play Now', 'sisyphus-quest/'] },
      ] },
    ];

    const PAGES_PER_CHAPTER = 8;
    const toc       = document.getElementById('toc');
    const chapterEl = document.getElementById('chapter');
    const leaf      = document.getElementById('leaf');
    const leafFront = document.getElementById('leaf-front');
    const calm      = matchMedia('(prefers-reduced-motion: reduce)');
    const narrow    = matchMedia('(max-width: 860px)');
    const flat      = [];

    books.forEach(b => {
      const h = document.createElement('div');
      h.className = 'bk';
      h.innerHTML = `Book ${b.n}. ${b.title}, <i>${b.gloss}</i>`;
      toc.appendChild(h);
      b.chapters.forEach((c, i) => {
        c.book = b;
        c.idx = i;
        c.page = flat.length * PAGES_PER_CHAPTER + 1;
        const a = document.createElement('a');
        a.href = '#' + c.slug;
        a.innerHTML = `<span class="t">${c.short}</span><span class="lead"></span><span>${c.page}</span>`;
        toc.appendChild(a);
        c.link = a;
        flat.push(c);
      });
    });

    const roman = n => ['i', 'ii', 'iii', 'iv', 'v', 'vi'][n] || n;

    function plate(c) {
      if (c.live) {
        return `<div class="plate-live"><div class="viewport"><iframe src="${c.live}" title="${c.short}, running live" scrolling="no" loading="lazy"></iframe></div></div>
          <div class="plate-cap">Fig. The orrery, in motion.</div>`;
      }
      return c.img ? `<img class="plate" src="${c.img}" alt="">` : '';
    }

    function render(c) {
      flat.forEach(x => x.link.setAttribute('aria-current', x === c));
      chapterEl.innerHTML = `
        <div class="running"><span>Book ${c.book.n}</span><span>${c.book.title.replace('Of ', '')}</span></div>
        <div class="num">Chapter ${roman(c.idx)}</div>
        <h2>${c.t}</h2>
        <div class="sub">${c.sub}</div>
        <div class="body">
          <div><p>${c.p}</p>${plate(c)}</div>
          <aside class="marginalia">${c.m.join('<br>')}${c.hand ? `<span class="hand">${c.hand}</span>` : ''}</aside>
        </div>
        <a class="cta" href="${c.cta[1]}" target="_blank">☞ ${c.cta[0]} ☜</a>
        <div class="finis">❧</div>
        <span class="folio">${c.page}</span>`;
      chapterEl.querySelector('.plate-live iframe')?.addEventListener('load', e => {
        // At plate size the orrery's settings panel would cover half the figure
        try {
          const s = e.target.contentDocument.createElement('style');
          s.textContent = '#control-panel { display: none; }';
          e.target.contentDocument.head.appendChild(s);
        } catch { /* cross-origin in some deploys; the panel just stays */ }
      });
    }

    let current = null;
    let busy = false;
    function turnTo(c) {
      if (!c || c === current || busy) return;
      const first = current === null;
      current = c;
      if (first || calm.matches) { render(c); return; }
      if (narrow.matches) { render(c); chapterEl.scrollIntoView({ behavior: 'smooth' }); return; }
      busy = true;
      // Copy the outgoing page onto the leaf, but don't spin up a second live iframe
      leafFront.innerHTML = chapterEl.innerHTML;
      leafFront.querySelectorAll('.plate-live').forEach(el => el.outerHTML = '<div class="plate-stub"></div>');
      leaf.classList.remove('turning'); void leaf.offsetWidth; leaf.classList.add('turning');
      render(c);
      setTimeout(() => {
        leaf.classList.remove('turning');
        busy = false;
        turnTo(fromHash()); // catch up if the hash moved mid-turn
      }, 900);
    }

    const fromHash = () => flat.find(c => '#' + c.slug === location.hash) || flat[0];
    addEventListener('hashchange', () => turnTo(fromHash()));

    addEventListener('keydown', e => {
      if (e.target.closest('input, textarea')) return;
      const i = flat.indexOf(current);
      if (e.key === 'ArrowRight' && i < flat.length - 1) location.hash = flat[i + 1].slug;
      if (e.key === 'ArrowLeft'  && i > 0)               location.hash = flat[i - 1].slug;
    });

    turnTo(fromHash());
  </script>
</body>
</html>
